<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Catálogo | PetMatch Mini')}"></head>
<body>
    <nav th:replace="~{fragments/navigation :: navigation}"></nav>
    
    <main class="page-container">
        <h1>Mascotas del catálogo</h1>
        <p>Hay <strong th:text="${pets.size()}">0</strong> mascotas registradas.</p>
        
        <section th:unless="${pets.isEmpty()}" class="pet-grid" aria-label="Lista de mascotas">
            <article th:each="pet : ${pets}" class="pet-card">
                <h2 th:text="${pet.name}">Nombre</h2>
                <p>
                    Especie: <span th:text="${pet.species}">Especie</span><br>
                    Edad: <span th:text="${pet.age}">0</span> años
                </p>
                <a class="button-link" th:href="@{/pets/{id}(id=${pet.id})}" href="#">Ver detalle</a>
            </article>
        </section>
    </main>
</body>
</html>
